# Render Blueprint for the draft API (free tier).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Spec: https://render.com/docs/blueprint-spec
#
# Free instances sleep after ~15 min idle (cold start ~30-60s); .github/workflows/keepwarm.yml
# pings /api/health to keep it warm. The API has no torch dependency — it serves the model in
# NumPy from winprob.npz and syncs both the match data (DATA_URL) and the model (MODEL_URL)
# from the GitHub Release at runtime, hot-swapping each without a redeploy.
services:
  - type: web
    name: bsdraft-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements-serve.txt
    startCommand: uvicorn bsdraft.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"   # adjust if Render reports this patch is unavailable
      - key: PYTHONPATH
        value: backend
      - key: DATA_URL
        value: https://github.com/mctatge/Brawlstars-Draft-Tool/releases/download/data-latest/matches.jsonl.gz
      - key: MODEL_URL
        value: https://github.com/mctatge/Brawlstars-Draft-Tool/releases/download/data-latest/winprob.npz
      # Precomputed stats artifact (built off-box from ALL matches). When set, the API loads
      # these instead of rebuilding in memory — so it uses the whole dataset with no OOM, and
      # STATS_MAX_MATCHES below applies only to the fallback rebuild if this artifact can't load.
      - key: STATS_URL
        value: https://github.com/mctatge/Brawlstars-Draft-Tool/releases/download/data-latest/stats.json.gz
      # Precomputed rank index (tag -> Ranked tier), built off-box from ALL matches. When set, the
      # API LOADS this .npz (the serve arrays themselves) for /api/rank's dataset fallback:
      # measured at 3.0M tags it's a 13.7 MB asset, ~0.3 s, ~66 MB peak — vs the ~263 MB decode
      # peak of the legacy rank_index.json.gz (still published as the rollback: revert this URL
      # and the loader reads it again) or the ~200 MB in-memory build neither host does anymore.
      - key: RANK_INDEX_URL
        value: https://github.com/mctatge/Brawlstars-Draft-Tool/releases/download/data-latest/rank_index.npz
      # Precomputed meta-drift report (a few KB), written by the crawler each cycle. When set,
      # /api/meta SERVES it instead of recomputing drift over the full dataset — two streaming
      # passes per data change, minutes on the free tier's CPU sliver (times out the frontend's
      # meta banner and the keep-warm meta alert).
      - key: META_REPORT_URL
        value: https://github.com/mctatge/Brawlstars-Draft-Tool/releases/download/data-latest/meta_report.json
      - key: REFRESH_SECONDS
        value: "600"
      # Cap the stats build to the most recent N matches so it fits the 512 MB free tier as the
      # dataset grows (the crawler keeps adding). Lower this if it still OOMs; 0 = use all.
      - key: STATS_MAX_MATCHES
        value: "60000"
