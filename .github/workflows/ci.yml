name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements-dev.txt
      - name: Keep serving imports free of training dependencies
        run: |
          PYTHONPATH=backend python - <<'PY'
          import sys
          from bsdraft.api import main
          assert not ({"torch", "sklearn", "pandas"} & sys.modules.keys())
          PY
      - name: Backend regression and Torch/NumPy parity tests
        run: PYTHONPATH=backend python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
